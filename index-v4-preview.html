<html lang="en">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #ffffff;
      --off-white: #f4f3ef;
      --grey-dim: rgba(255,255,255,0.22);
      --grey-mid: rgba(255,255,255,0.5);
      --accent: #c8f135;
      --border: rgba(255,255,255,0.1);
      --border-light: rgba(0,0,0,0.1);
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAV ─────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      height: 64px;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--white);
    }

    .nav-logo svg {
      width: 22px; height: 22px;
      flex-shrink: 0;
    }

    .nav-wordmark {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--white); }

    .nav-cta {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent) !important;
      border: 1px solid var(--accent);
      padding: 8px 18px;
      border-radius: 2px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .nav-cta:hover {
      background: var(--accent);
      color: var(--black) !important;
    }

    /* ─── HERO ────────────────────────────────────── */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 48px 80px;
      position: relative;
      background: var(--black);
      overflow: hidden;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(64px, 11vw, 160px);
      font-weight: 300;
      line-height: 0.92;
      letter-spacing: -0.03em;
      margin-bottom: 40px;
    }

    .hero-title .line-static {
      display: block;
      color: var(--white);
    }

    .hero-title .line-animated {
      display: block;
      color: var(--grey-dim);
      position: relative;
      height: 1.0em;
      overflow: hidden;
    }

    .word-cycle {
      position: absolute;
      left: 0;
      animation: wordCycle 6s infinite;
    }

    @keyframes wordCycle {
      0%, 28%   { opacity: 1; transform: translateY(0); }
      33%, 95%  { opacity: 0; transform: translateY(-1.1em); }
      100%      { opacity: 1; transform: translateY(0); }
    }

    .word-cycle:nth-child(1) { animation-delay: 0s; }
    .word-cycle:nth-child(2) { animation-delay: 2s; }
    .word-cycle:nth-child(3) { animation-delay: 4s; }

    .hero-sub {
      font-family: var(--font-body);
      font-size: clamp(15px, 1.6vw, 19px);
      font-weight: 300;
      color: rgba(255,255,255,0.55);
      max-width: 520px;
      line-height: 1.65;
      margin-bottom: 40px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 48px;
    }

    .btn-primary {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 500;
      color: var(--black);
      background: var(--white);
      border: none;
      border-radius: 100px;
      padding: 16px 32px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
      display: inline-block;
    }

    .btn-primary:hover {
      background: var(--off-white);
      transform: translateY(-1px);
    }

    .scroll-label {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }

    /* ─── TICKER ──────────────────────────────────── */
    .ticker-wrap {
      overflow: hidden;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--black);
      padding: 14px 0;
    }

    .ticker-track {
      display: flex;
      white-space: nowrap;
      animation: ticker 28s linear infinite;
    }

    .ticker-track span {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      padding: 0 24px;
    }

    .ticker-track span.dot { color: rgba(255,255,255,0.15); }

    @keyframes ticker {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ─── STATEMENT SECTION ───────────────────────── */
    #statement {
      padding: 120px 48px;
      background: var(--black);
    }

    .statement-text {
      font-family: var(--font-display);
      font-size: clamp(32px, 5vw, 72px);
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: -0.02em;
      max-width: 1000px;
    }

    .statement-text .word {
      display: inline-block;
      color: var(--grey-dim);
      transition: color 0.3s;
      margin-right: 0.22em;
    }

    .statement-text .word.lit { color: var(--white); }

    /* ─── PHILOSOPHY / 01 ─────────────────────────── */
    #philosophy {
      padding: 120px 48px;
      background: var(--off-white);
      color: var(--black);
    }

    .section-label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 64px;
      opacity: 0.45;
    }

    .section-label.light { color: rgba(255,255,255,0.45); }

    .section-heading {
      font-family: var(--font-display);
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 80px;
      line-height: 1.1;
    }

    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 48px;
    }

    .pillar {
      border-top: 1px solid rgba(0,0,0,0.12);
      padding-top: 32px;
    }

    .pillar-num {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .pillar h3 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 14px;
      color: var(--black);
    }

    .pillar p {
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.7;
      color: rgba(0,0,0,0.55);
    }

    /* ─── METHODOLOGY / 02 ────────────────────────── */
    #methodology {
      padding: 120px 48px;
      background: var(--black);
    }

    .loop-steps {
      display: grid;
      gap: 0;
      margin-top: 0;
    }

    .loop-step {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 32px;
      align-items: start;
      padding: 48px 0;
      border-top: 1px solid var(--border);
    }

    .loop-step:last-child { border-bottom: 1px solid var(--border); }

    .step-num {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.25);
      padding-top: 4px;
    }

    .step-body {}

    .step-label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .step-body h3 {
      font-family: var(--font-display);
      font-size: clamp(22px, 2.5vw, 34px);
      font-weight: 300;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }

    .step-body p {
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.75;
      color: rgba(255,255,255,0.5);
      max-width: 640px;
    }

    /* ─── THE SYSTEM / 03 ─────────────────────────── */
    #the-system {
      padding: 120px 48px;
      background: var(--off-white);
      color: var(--black);
    }

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background:
