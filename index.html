  <style>
    /* ─── TOKENS ─────────────────────────────────────────────── */
    :root {
      --bg:           #080808;
      --bg-alt:       #0f0f0f;
      --surface:      #141414;
      --border:       rgba(255,255,255,0.08);
      --text:         #f0f0ec;
      --text-muted:   rgba(240,240,236,0.52);
      --text-light:   rgba(240,240,236,0.28);
      --accent:       #00c8a0;
      --accent-dim:   rgba(0,200,160,0.12);

      --font-display: 'Times New Roman', Georgia, serif;
      --font-body:    system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono:    'Courier New', Courier, monospace;

      --max-w:        1440px;
      --pad-x:        clamp(24px, 6vw, 96px);
      --section-py:   clamp(80px, 12vw, 160px);
      --radius:       4px;

      --ease-out:     cubic-bezier(0.16, 1, 0.3, 1);
      --transition:   0.35s var(--ease-out);
    }

    /* ─── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: clamp(15px, 1.1vw, 17px);
      line-height: 1.65;
      overflow-x: hidden;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    /* ─── UTILITY ────────────────────────────────────────────── */
    .container {
      max-width: var(--max-w);
      margin-inline: auto;
      padding-inline: var(--pad-x);
    }
    .label {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.75rem;
    }
    .section { padding-block: var(--section-py); }
    .section--alt { background: var(--bg-alt); }
    .section--surface { background: var(--surface); }

    /* ─── SCROLL REVEAL ──────────────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal--delay-1 { transition-delay: 0.1s; }
    .reveal--delay-2 { transition-delay: 0.2s; }
    .reveal--delay-3 { transition-delay: 0.3s; }
    .reveal--delay-4 { transition-delay: 0.4s; }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    /* ─── NAV ────────────────────────────────────────────────── */
    #site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 900;
      padding-block: 0;
      transition: background var(--transition), border-bottom var(--transition), backdrop-filter var(--transition);
    }
    #site-header.scrolled {
      background: rgba(8,8,8,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max-w);
      margin-inline: auto;
      padding-inline: var(--pad-x);
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 1.0625rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .nav-logo svg { flex-shrink: 0; }
    .nav-links {
      display: flex;
      gap: clamp(20px, 3vw, 44px);
      align-items: center;
    }
    .nav-links a {
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      transition: color var(--transition);
      white-space: nowrap;
    }
    .nav-links a:hover, .nav-links a:focus-visible { color: var(--text); }
    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 18px;
      border-radius: var(--radius);
      transition: background var(--transition), color var(--transition);
    }
    .nav-cta:hover, .nav-cta:focus-visible {
      background: var(--accent);
      color: var(--bg);
    }
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
      border-radius: var(--radius);
      transition: background var(--transition);
    }
    .hamburger:hover { background: var(--surface); }
    .hamburger span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: var(--text);
      transition: transform var(--transition), opacity var(--transition);
    }
    .hamburger[aria-expanded="true"] span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .hamburger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    /* Mobile drawer */
    #mobile-menu {
      display: none;
      position: fixed;
      inset: 68px 0 0;
      background: rgba(8,8,8,0.97);
      backdrop-filter: blur(16px);
      z-index: 850;
      flex-direction: column;
      padding: clamp(32px, 8vw, 64px) var(--pad-x);
      gap: 2rem;
    }
    #mobile-menu.open { display: flex; }
    #mobile-menu a {
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      transition: color var(--transition);
    }
    #mobile-menu a:hover { color: var(--text); }
    body.menu-open { overflow: hidden; }

    @media (max-width: 860px) {
      .nav-links, .nav-cta { display: none; }
      .hamburger { display: flex; }
    }

    /* ─── HERO ───────────────────────────────────────────────── */
    #hero {
      min-height: 100svh;
      display: grid;
      align-items: end;
      padding-block: 0 clamp(64px, 10vw, 120px);
      padding-top: 120px;
      position: relative;
      overflow: hidden;
    }
    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 70% 40%, rgba(0,200,160,0.04) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-inner {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4rem;
      align-items: end;
    }
    .hero-headline {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 8.5vw, 8rem);
      font-weight: 700;
      line-height: 1.0;
      letter-spacing: -0.02em;
      margin-bottom: clamp(2rem, 4vw, 3.5rem);
    }
    .hero-headline em {
      font-style: normal;
      color: var(--text-muted);
    }
    .hero-sub {
      max-width: 520px;
      color: var(--text-muted);
      font-size: clamp(1rem, 1.3vw, 1.125rem);
      line-height: 1.7;
    }
    .hero-sidebar {
      writing-mode: vertical-rl;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-light);
      transform: rotate(180deg);
      align-self: stretch;
      display: flex;
      align-items: center;
    }
    .hero-rule {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-top: clamp(3rem, 5vw, 5rem);
    }
    @media (max-width: 600px) {
      .hero-sidebar { display: none; }
      .hero-inner { grid-template-columns: 1fr; }
    }

    /* ─── SECTION HEADINGS ───────────────────────────────────── */
    .section-heading {
      font-family: var(--font-display);
      font-size: clamp(2.25rem, 5vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: clamp(3rem, 5vw, 5rem);
    }

    /* ─── PHILOSOPHY ─────────────────────────────────────────── */
    .principles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
      gap: clamp(1.5rem, 3vw, 2.5rem);
    }
    .principle-item {
      border-top: 1px solid var(--border);
      padding-top: 1.75rem;
    }
    .principle-num {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .principle-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      margin-bottom: 0.75rem;
    }
    .principle-text { color: var(--text-muted); font-size: 0.9375rem; line-height: 1.7; }

    /* ─── METHODOLOGY ────────────────────────────────────────── */
    .method-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
      gap: clamp(1.5rem, 3vw, 2.5rem);
    }
    .method-item {
      border-top: 1px solid var(--border);
      padding-top: 1.75rem;
    }
    .method-num {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .method-title {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      color: var(--text);
    }
    .method-text { color: var(--text-muted); font-size: 0.9375rem; line-height: 1.7; }

    /* ─── STRATEGY ───────────────────────────────────────────── */
    .strategy-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(3rem, 6vw, 7rem);
      align-items: start;
    }
    @media (max-width: 768px) { .strategy-grid { grid-template-columns: 1fr; } }

    .strategy-pillars { display: flex; flex-direction: column; gap: 2.5rem; }
    .pillar-item { display: flex; gap: 1.5rem; align-items: flex-start; }
    .pillar-num {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--accent);
      font-weight: 700;
      padding-top: 3px;
      flex-shrink: 0;
    }
    .pillar-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .pillar-text { color: var(--text-muted); font-size: 0.9375rem; line-height: 1.6; }

    .benefits-table {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: clamp(1.5rem, 3vw, 2.5rem);
    }
    .benefits-header {
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .benefit-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1.5rem;
      padding-block: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .benefit-row:last-child { border-bottom: none; padding-bottom: 0; }
    .benefit-dim { font-size: 0.9375rem; font-weight: 600; flex-shrink: 0; }
    .benefit-val { font-size: 0.875rem; color: var(--text-muted); text-align: right; line-height: 1.5; max-width: 220px; }

    /* ─── SERVICES / CAPABILITIES ────────────────────────────── */
    .services-list { display: flex; flex-direction: column; }
    .service-item {
      border-top: 1px solid var(--border);
    }
    .service-trigger {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 2.5rem 0;
      cursor: pointer;
      transition: color var(--transition);
    }
    .service-trigger:hover .service-title { color: var(--accent); }
    .service-title-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .service-tag {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .service-title {
      font-family: var(--font-display);
      font-size: clamp(1.375rem, 2.5vw, 2.125rem);
      font-weight: 700;
      transition: color var(--transition);
    }
    .service-icon {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      transition: transform var(--transition), border-color var(--transition);
    }
    .service-item.open .service-icon { transform: rotate(45deg); border-color: var(--accent); }
    .service-icon svg { stroke: var(--text-muted); }
    .service-body {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.5s var(--ease-out);
    }
    .service-body-inner {
      padding-bottom: 3rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
    }
    @media (max-width: 600px) { .service-body-inner { grid-template-columns: 1fr; gap: 1.5rem; } }
    .service-desc { color: var(--text-muted); font-size: 1rem; line-height: 1.7; }
    .service-bullets { display: flex; flex-direction: column; gap: 0.75rem; }
    .service-bullets li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
    }
    .service-bullets li::before {
      content: '';
      display: block;
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ─── CASE STUDIES ───────────────────────────────────────── */
    .case-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: clamp(2rem, 4vw, 3rem);
    }
    .case-card {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      border-top: 1px solid var(--border);
      padding-top: 1.75rem;
      transition: border-color var(--transition);
    }
    .case-card:hover { border-color: var(--accent); }
    .case-thumb {
      aspect-ratio: 16/9;
      background: var(--surface);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-light);
      border: 1px solid var(--border);
    }
    .case-sector {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
